services:
  nai-gate:
    build: .
    container_name: nai-gate
    restart: unless-stopped
    # 部署 / 重启时给正在生成的图留足时间收尾并记账（默认只有 10 秒，生成中的请求会被硬杀、不进日志）
    stop_grace_period: 120s
    ports:
      - "127.0.0.1:3003:8000"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
      # 端口只绑定在本机(127.0.0.1)，只有本机的反向代理能连上，可信任其 X-Forwarded-For，
      # 这样登录/无效 Key 限流按真实访客 IP 计，而不是把所有人算成同一个。
      - FORWARDED_ALLOW_IPS=*
    volumes:
      - ./data:/app/data
    # Caddy 直连这个固定 IP（不经 127.0.0.1:3003 的 docker-proxy）：旧容器收尾 / 新容器未起时连接直接被拒，
    # Caddy 才会把请求挂住重试；走 docker-proxy 时连接先被「接受」再断开，POST 出图会直接 502（2026-10-10 部署实测）。
    # 127.0.0.1:3003 保留给本机健康检查和监控脚本。
    networks:
      default:
      edge:
        ipv4_address: 172.30.0.10

  # 可选：Discord /register 机器人。配置好 .env 里的 DISCORD_* 后用
  #   docker compose --profile discord up -d --build
  # 只给它需要的三个变量，不带上游 Token。
  discord-bot:
    profiles: ["discord"]
    build: ./integration
    container_name: nai-gate-discord
    restart: unless-stopped
    depends_on:
      - nai-gate
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - REGISTRATION_BRIDGE_SECRET=${REGISTRATION_BRIDGE_SECRET}
      - REGISTRATION_BACKEND_URL=http://nai-gate:8000
      - SITE_URL=${SITE_URL}
      - PRAISE_API_KEY=${PRAISE_API_KEY:-}
      - PRAISE_BASE_URL=${PRAISE_BASE_URL:-https://api.longcat.chat/anthropic}
      - PRAISE_MODEL=${PRAISE_MODEL:-LongCat-2.5-Preview}
      - GALLERY_AI_DAILY=${GALLERY_AI_DAILY:-30}
      - AUDIT_PROMPTS=${AUDIT_PROMPTS:-0}
      - AUDIT_THUMBS=${AUDIT_THUMBS:-0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-7}

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
