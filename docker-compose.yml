services:
  nai-gate:
    build: .
    container_name: nai-gate
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8000"
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
      # 端口只绑定在本机(127.0.0.1)，只有本机的反向代理能连上，可信任其 X-Forwarded-For，
      # 这样登录/无效 Key 限流按真实访客 IP 计，而不是把所有人算成同一个。
      - FORWARDED_ALLOW_IPS=*
    volumes:
      - ./data:/app/data

  # 可选：Discord /register 机器人。配置好 .env 里的 DISCORD_* 后用
  #   docker compose --profile discord up -d --build
  # 只给它需要的三个变量，不带上游 Token。
  discord-bot:
    profiles: ["discord"]
    build: ./integration
    container_name: nai-gate-discord
    restart: unless-stopped
    depends_on:
      - nai-gate
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - REGISTRATION_BRIDGE_SECRET=${REGISTRATION_BRIDGE_SECRET}
      - REGISTRATION_BACKEND_URL=http://nai-gate:8000
      - SITE_URL=${SITE_URL}
      - AUDIT_PROMPTS=${AUDIT_PROMPTS:-0}
      - AUDIT_THUMBS=${AUDIT_THUMBS:-0}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-7}
