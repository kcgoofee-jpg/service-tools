name: CI

on:
  push:
    branches: [main, rewrite/v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: 前端（Biome / tsc / Vitest / 构建）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit
      - run: pnpm vitest run
      - run: pnpm vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  rust:
    name: Rust（fmt / clippy / 测试）
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v5
      - name: BoringSSL 构建依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  e2e:
    name: 浏览器端到端（含排版硬规则：不许孤字、同排控件对齐）
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v5
      - name: BoringSSL 构建依赖 + 中文字体（孤字检查要按真实字宽折行）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev fonts-noto-cjk
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: cargo build --locked -p xtask
      - name: 起本地全套（假上游 + 合成数据）和前端
        run: |
          cargo xtask dev > /tmp/gate.log 2>&1 &
          (cd web && pnpm exec vite --port 5174 --strictPort > /tmp/vite.log 2>&1 &)
          for _ in $(seq 1 90); do
            curl -fsS -m 2 http://127.0.0.1:18000/healthz >/dev/null 2>&1 && curl -fsS -m 2 -o /dev/null http://localhost:5174/ && exit 0
            sleep 2
          done
          cat /tmp/gate.log /tmp/vite.log; exit 1
      - run: pnpm exec playwright test
        working-directory: web
        env:
          E2E_BASE: http://localhost:5174

  secrets:
    name: 公开仓库红线（gitleaks + 夹具里不许出现真实 ID / IP）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 夹具与测试数据只允许合成数据
        run: tools/ci/check-fixtures.sh

  ops-binary:
    name: 运维命令静态二进制（宿主机上的巡检用）
    runs-on: ubuntu-24.04
    needs: [rust]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p gate-ops --bin nai-ops
      - uses: actions/upload-artifact@v4
        with:
          name: nai-ops-linux-musl
          path: target/x86_64-unknown-linux-musl/release/nai-ops
          retention-days: 7

  image:
    name: 镜像（GHCR）
    runs-on: ubuntu-24.04
    needs: [rust]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/owl-gate
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 同一镜像另存为 tar 附件：服务器不放任何 GitHub 凭据，本机用 gh 下载后 scp 过去 docker load
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: owl-gate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/owl-gate.tar
      - run: gzip -1 /tmp/owl-gate.tar
      - uses: actions/upload-artifact@v4
        with:
          name: owl-gate-image
          path: /tmp/owl-gate.tar.gz
          retention-days: 7
          compression-level: 0
