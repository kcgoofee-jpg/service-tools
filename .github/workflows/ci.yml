name: CI

on:
  push:
    branches: [main, rewrite/v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: 前端（Biome / tsc / Vitest / 构建）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit
      - run: pnpm vitest run
      - run: pnpm vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  rust:
    name: Rust（fmt / clippy / 测试）
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v5
      - name: BoringSSL 构建依赖
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  secrets:
    name: 公开仓库红线（gitleaks + 夹具里不许出现真实 ID / IP）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 夹具与测试数据只允许合成数据
        run: tools/ci/check-fixtures.sh

  image:
    name: 镜像（GHCR）
    runs-on: ubuntu-24.04
    needs: [rust]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/owl-gate
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 同一镜像另存为 tar 附件：服务器不放任何 GitHub 凭据，本机用 gh 下载后 scp 过去 docker load
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: owl-gate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/owl-gate.tar
      - run: gzip -1 /tmp/owl-gate.tar
      - uses: actions/upload-artifact@v4
        with:
          name: owl-gate-image
          path: /tmp/owl-gate.tar.gz
          retention-days: 7
          compression-level: 0
